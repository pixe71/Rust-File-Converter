[package]
name = "file_converter"
version = "1.1.0"
edition = "2021"

[dependencies]
eframe = "0.29"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "bmp", "gif", "webp", "ico"] }
rfd = "0.15"
anyhow = "1.0.103"
same-file = "1.0"
tempfile = "3.24"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
ureq = { version = "3", default-features = false, features = ["native-tls"] }
zip = { version = "4", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
